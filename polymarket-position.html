<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BR Dashboard • Bitcoin Scenario Visualizer</title><link rel="icon" href="./assets/favicon.ico"><link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Teko:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#090909;--panel:#111;--text:#f1eee8;--muted:#8f897d;--accent:#d1a24a;--border:rgba(209,162,74,.35);--mono:'Roboto Mono',monospace;--head:'Teko',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono)}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(1200px 820px at 10% 10%,rgba(209,162,74,.08),transparent 65%),#090909}.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#0a0a0af2;border-right:1px solid var(--border);padding:18px}.pt,.st{font-family:var(--head);color:var(--accent);text-transform:uppercase;letter-spacing:.08em}.pt{font-size:20px;margin:12px 0 10px}.nav{display:block;border:1px solid var(--border);padding:9px 10px;color:var(--text);text-decoration:none;margin-bottom:8px;background:#d1a24a0a}.nav.active{background:#d1a24a29}.wrap{margin-left:250px;padding:20px 26px}header,.card{border:1px solid var(--border);background:#0f0f0fd1;padding:14px;margin-bottom:14px}h1{margin:0;font-family:var(--head);font-size:30px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}.sub,.note,.muted{color:var(--muted);font-size:11px}.st{font-size:22px;margin-bottom:10px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}input{width:100%;padding:9px;background:#0f0f0f;color:var(--text);border:1px solid var(--border);font-family:var(--mono)}button{padding:9px 11px;border:1px solid #d1a24a80;background:#d1a24a1f;color:var(--text);font-family:var(--mono);cursor:pointer}.danger{color:#c9958d;border-color:#8d666099}.chart{height:540px;border:1px solid var(--border);background:#0c0c0c;padding:8px}canvas{width:100%;height:100%;display:block}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:12px 1fr auto auto auto;gap:12px;align-items:center;border:1px solid #d1a24a38;padding:10px;background:#0c0c0c}.dot{width:10px;height:10px}.val{text-align:right;font-weight:700}@media(max-width:900px){.side{position:static;width:auto}.wrap{margin-left:0}.controls{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.controls{grid-template-columns:1fr}.chart{height:430px}.row{grid-template-columns:12px 1fr auto}.optional{display:none}}
</style></head><body><aside class="side"><div class="pt">Pages</div><a class="nav" href="index.html">Dashboard</a><a class="nav active" href="polymarket-position.html">BTC Projection</a></aside><main class="wrap"><header><h1>Bitcoin Scenario Visualizer</h1><div class="sub">BTC • CAGR PROJECTION • RECURRING DRAWDOWN ENGINE</div></header>
<section class="card"><div class="st">Model Parameters</div><div class="controls"><div><label>Live BTC Price (USD)</label><input id="price" type="text" value="Loading live price…" readonly></div><div><label>Projection Start</label><input id="year" type="text" value="Today" readonly></div><div><label>Projection Horizon (Years)</label><input id="years" type="number" min="1" max="50" value="10"></div><button id="update">Update Model</button></div></section>
<section class="card"><div class="st">Add Scenario</div><div class="controls"><div><label>CAGR / Annual Growth (%)</label><input id="cagr" type="number" step=".1" value="20"></div><div><label>Drawdown (%) — 0 for none</label><input id="dd" type="number" min="0" max="99" value="0"></div><div><label>Drawdown Every N Years</label><input id="freq" type="number" min="1" value="4"></div><div><button id="add">+ Add Scenario</button> <button class="danger" id="clear">Clear</button></div></div><p class="note">Drawdowns permanently reduce the scenario base. Growth continues from the reduced value with no artificial catch-up.</p></section>
<section class="card"><div class="st">Projection Matrix</div><div class="chart"><canvas id="chart"></canvas></div></section><section class="card"><div class="st">Active Scenarios</div><div id="list" class="list"></div></section></main><script>
const $=x=>document.getElementById(x),cv=$('chart'),cx=cv.getContext('2d'),colors=['#d1a24a','#6d8a70','#8d6660','#668db0','#9b7ab8','#b58a5b','#65a3a0','#b5aa63'];let S=[],ci=0,livePrice=null,startDate=new Date();const cash=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n),short=n=>n>=1e6?'$'+(n/1e6).toFixed(1)+'M':n>=1e3?'$'+(n/1e3).toFixed(0)+'k':'$'+n.toFixed(0);
function path(s){let v=livePrice||1,a=[v],n=Math.max(1,+$('years').value||10);for(let i=1;i<=n;i++){v*=1+s.c/100;if(s.d>0&&i%s.f===0)v*=1-s.d/100;a.push(v)}return a}function colorForCagr(c){c=+c;let existing=S.find(s=>s.c===c);return existing?existing.col:colors[ci++%colors.length]}function add(c,d=0,f=4){c=+c;S.push({id:Date.now()+Math.random(),c,d:+d,f:+f,col:colorForCagr(c)});render()}
function draw(){let r=Math.max(devicePixelRatio||1,1),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*r;cv.height=h*r;cx.setTransform(r,0,0,r,0,0);let p={l:90,r:25,t:30,b:50},cw=w-p.l-p.r,ch=h-p.t-p.b,n=Math.max(1,+$('years').value||10),sy=startDate.getFullYear(),A=S.map(path),max=Math.max(1,...A.flat())*1.08;cx.fillStyle='#0c0c0c';cx.fillRect(0,0,w,h);cx.font='11px Roboto Mono';for(let i=0;i<=5;i++){let y=p.t+i*ch/5,v=max*(1-i/5);cx.strokeStyle='#d1a24a26';cx.beginPath();cx.moveTo(p.l,y);cx.lineTo(w-p.r,y);cx.stroke();cx.fillStyle='#8f897d';cx.textAlign='right';cx.fillText(short(v),p.l-8,y+4)}let t=Math.min(n,10);for(let i=0;i<=t;i++){let k=Math.round(i*n/t),x=p.l+k/n*cw;cx.fillStyle='#8f897d';cx.textAlign='center';cx.fillText(sy+k,x,h-24)}S.forEach((s,j)=>{cx.strokeStyle=s.col;cx.lineWidth=2.2;cx.setLineDash(s.d?[7,6]:[]);cx.beginPath();A[j].forEach((v,i)=>{let x=p.l+i/n*cw,y=p.t+(1-v/max)*ch;i?cx.lineTo(x,y):cx.moveTo(x,y)});cx.stroke();cx.setLineDash([])})}
function render(){draw();let l=$('list');l.innerHTML='';S.forEach(s=>{let a=path(s),n=+$('years').value||10,rc=(Math.pow(a.at(-1)/a[0],1/n)-1)*100,e=document.createElement('div');e.className='row';e.innerHTML='<i class="dot" style="background:'+s.col+'"></i><div><b>'+s.c+'% CAGR</b><div class="muted">'+(s.d?s.d+'% drawdown every '+s.f+' years':'No drawdowns')+'</div></div><div class="val optional">'+cash(a.at(-1))+'<div class="muted">Terminal</div></div><div class="val optional">'+rc.toFixed(2)+'%<div class="muted">Realized CAGR</div></div><button class="danger">×</button>';e.querySelector('button').onclick=()=>{S=S.filter(x=>x.id!==s.id);render()};l.appendChild(e)})}
async function loadLivePrice(){const p=$('price'),d=$('year');d.value=startDate.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});try{const r=await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot',{cache:'no-store'});if(!r.ok)throw new Error('feed');const j=await r.json(),n=Number(j&&j.data&&j.data.amount);if(!Number.isFinite(n))throw new Error('price');livePrice=n;p.value=cash(n)+' • LIVE';p.title='Live BTC/USD spot via Coinbase';render()}catch(e){p.value='Live BTC feed unavailable';p.title='Projection disabled until the live price feed is available';livePrice=null;render()}}loadLivePrice();
$('add').onclick=()=>{let c=+$('cagr').value,d=+$('dd').value||0,f=+$('freq').value||4;if(!Number.isFinite(c)||d<0||d>=100||f<1)return alert('Check scenario values.');add(c,d,f)};$('clear').onclick=()=>{S=[];ci=0;render()};$('update').onclick=render;window.onresize=draw;[[10,0],[10,35],[20,0],[20,35],[30,0],[30,35]].forEach(x=>add(x[0],x[1],4));
</script></body></html>
